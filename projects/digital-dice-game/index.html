<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Digital Dice Game</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>Digital Dice Game</h1>

        <p>
            Roll the dice and see who gets the higher number.
        </p>

        <div class="players">

            <div class="player">
                <h2>Player 1</h2>
                <div id="dice1">⚀</div>
                <p id="score1">0</p>
            </div>

            <div class="player">
                <h2>Player 2</h2>
                <div id="dice2">⚀</div>
                <p id="score2">0</p>
            </div>

        </div>

        <p id="result">
            Click Roll Dice to start!
        </p>

        <button id="rollBtn">
            Roll Dice
        </button>

    </div>

    <script src="script.js"></script>

</body>

</html>

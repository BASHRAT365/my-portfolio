<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Loan Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Loan Calculator</h1>

        <p>Calculate your monthly loan payment and total interest.</p>

        <div class="calculator">

            <label for="loanAmount">Loan Amount</label>

            <input
                type="number"
                id="loanAmount"
                placeholder="Enter loan amount"
            >

            <label for="interestRate">Annual Interest Rate (%)</label>

            <input
                type="number"
                id="interestRate"
                placeholder="Enter interest rate"
                step="0.01"
            >

            <label for="loanYears">Loan Term (Years)</label>

            <input
                type="number"
                id="loanYears"
                placeholder="Enter loan term"
            >

            <button id="calculateBtn">
                Calculate Loan
            </button>

            <div id="result">

                <p>Monthly Payment: <span id="monthlyPayment">--</span></p>

                <p>Total Payment: <span id="totalPayment">--</span></p>

                <p>Total Interest: <span id="totalInterest">--</span></p>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>

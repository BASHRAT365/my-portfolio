<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Notes App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>📝 Notes App</h1>

        <div id="notesContainer">

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>

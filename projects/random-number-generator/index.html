<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Random Number Generator</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>Random Number Generator</h1>

        <p>
            Generate a random number between two values.
        </p>

        <div class="generator">

            <label for="minNumber">
                Minimum Number
            </label>

            <input
                type="number"
                id="minNumber"
                placeholder="Enter minimum number"
            >

            <label for="maxNumber">
                Maximum Number
            </label>

            <input
                type="number"
                id="maxNumber"
                placeholder="Enter maximum number"
            >

            <button id="generateBtn">
                Generate Number
            </button>

            <div class="result">

                <h2>Random Number</h2>

                <span id="resultNumber">0</span>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>

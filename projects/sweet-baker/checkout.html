<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Sweet & Baker Checkout — Complete your bakery order."
    >

    <title>Checkout | Sweet & Baker</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- HEADER -->

    <header class="header">

        <div class="nav-container">

            <a href="index.html" class="logo">
                Sweet & Baker
            </a>

            <a href="index.html" class="back-home">
                ← Back to Shop
            </a>

        </div>

    </header>



    <!-- CHECKOUT -->

    <main class="checkout-page">


        <div class="checkout-container">


            <!-- PAGE HEADING -->

            <div class="checkout-heading">

                <p>
                    COMPLETE YOUR ORDER
                </p>

                <h1>
                    Checkout
                </h1>

            </div>



            <div class="checkout-layout">


                <!-- CUSTOMER DETAILS -->

                <section class="checkout-form-section">

                    <h2>
                        Customer Details
                    </h2>


                    <form
                        class="checkout-form"
                        id="checkoutForm"
                    >


                        <label for="checkoutName">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="checkoutName"
                            placeholder="Your Full Name"
                            required
                        >



                        <label for="checkoutPhone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="checkoutPhone"
                            placeholder="Your Phone Number"
                            required
                        >



                        <label for="checkoutEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="checkoutEmail"
                            placeholder="Your Email Address"
                            required
                        >



                        <h2 class="address-heading">
                            Delivery / Pickup Address
                        </h2>



                        <label for="address">
                            Street Address
                        </label>

                        <input
                            type="text"
                            id="address"
                            placeholder="Street Address"
                            required
                        >



                        <label for="suburb">
                            Suburb
                        </label>

                        <input
                            type="text"
                            id="suburb"
                            placeholder="Suburb"
                            required
                        >



                        <div class="checkout-row">


                            <div>

                                <label for="state">
                                    State
                                </label>

                                <select
                                    id="state"
                                    required
                                >

                                    <option value="">
                                        Select State
                                    </option>

                                    <option value="NSW">
                                        NSW
                                    </option>

                                    <option value="VIC">
                                        VIC
                                    </option>

                                    <option value="QLD">
                                        QLD
                                    </option>

                                    <option value="WA">
                                        WA
                                    </option>

                                    <option value="SA">
                                        SA
                                    </option>

                                    <option value="TAS">
                                        TAS
                                    </option>

                                    <option value="ACT">
                                        ACT
                                    </option>

                                    <option value="NT">
                                        NT
                                    </option>

                                </select>

                            </div>



                            <div>

                                <label for="postcode">
                                    Postcode
                                </label>

                                <input
                                    type="text"
                                    id="postcode"
                                    placeholder="Postcode"
                                    required
                                >

                            </div>


                        </div>



                        <label for="orderDate">
                            Preferred Pickup / Event Date
                        </label>

                        <input
                            type="date"
                            id="orderDate"
                            required
                        >



                        <label for="orderNotes">
                            Order Notes
                        </label>

                        <textarea
                            id="orderNotes"
                            rows="5"
                            placeholder="Tell us about flavours, size, design or special requirements..."
                        ></textarea>



                        <button
                            type="submit"
                            class="checkout-submit-btn"
                        >
                            Place Order
                        </button>


                    </form>

                </section>



                <!-- ORDER SUMMARY -->

                <aside class="order-summary">

                    <h2>
                        Your Order
                    </h2>


                    <div
                        class="checkout-cart-items"
                        id="checkoutCartItems"
                    >

                        <p>
                            Your cart is empty.
                        </p>

                    </div>


                    <div class="summary-total">

                        <span>
                            Total
                        </span>

                        <strong id="checkoutTotal">
                            $0.00
                        </strong>

                    </div>


                </aside>


            </div>

        </div>

    </main>



    <!-- FOOTER -->

    <footer class="footer">

        <div class="footer-bottom">

            <p>
                © 2026 Sweet & Baker. All Rights Reserved.
            </p>

        </div>

    </footer>

<script src="checkout.js"></script>
</body>

</html>

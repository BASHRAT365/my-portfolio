<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Palindrome Checker</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>Palindrome Checker</h1>

        <p>
            Check whether a word or phrase reads
            the same forward and backward.
        </p>

        <div class="checker">

            <label for="textInput">
                Enter a Word or Phrase
            </label>

            <input
                type="text"
                id="textInput"
                placeholder="Enter text here..."
            >

            <button id="checkBtn">
                Check Palindrome
            </button>

            <p id="result">
                Result will appear here.
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>

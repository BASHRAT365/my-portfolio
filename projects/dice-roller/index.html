<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dice Roller</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>Dice Roller</h1>

        <p>
            Click the button to roll the dice.
        </p>

        <div class="dice-box">

            <div id="dice">
                ⚀
            </div>

            <p id="result">
                Click Roll Dice to start!
            </p>

        </div>

        <button id="rollBtn">
            Roll Dice
        </button>

    </div>

    <script src="script.js"></script>

</body>

</html>

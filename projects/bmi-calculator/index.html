<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BMI Calculator</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>⚖️ BMI Calculator</h1>

        <p class="subtitle">
            Calculate your Body Mass Index
        </p>


        <div class="input-group">

            <label for="weight">
                Weight (kg)
            </label>

            <input
                type="number"
                id="weight"
                placeholder="Enter your weight"
                min="1"
                step="0.1">

        </div>


        <div class="input-group">

            <label for="height">
                Height (cm)
            </label>

            <input
                type="number"
                id="height"
                placeholder="Enter your height"
                min="1"
                step="0.1">

        </div>


        <button id="calculateButton">
            Calculate BMI
        </button>


        <div id="result">

            <h2>Your BMI</h2>

            <p id="bmiValue">--</p>

            <p id="category">
                Enter your details to calculate BMI.
            </p>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>

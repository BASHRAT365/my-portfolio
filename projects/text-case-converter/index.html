<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Text Case Converter</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>Text Case Converter</h1>

        <p>
            Convert your text into different cases easily.
        </p>

        <textarea
            id="textInput"
            placeholder="Type or paste your text here..."
        ></textarea>

        <div class="buttons">

            <button id="upperBtn">
                UPPERCASE
            </button>

            <button id="lowerBtn">
                lowercase
            </button>

            <button id="capitalizeBtn">
                Capitalize Words
            </button>

            <button id="clearBtn">
                Clear
            </button>

            <button id="copyBtn">
                Copy Text
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>

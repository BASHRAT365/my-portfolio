<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Pomodoro Timer</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>Pomodoro Timer</h1>

        <p>
            Focus on your work and take regular breaks.
        </p>

        <div class="timer-box">

            <div class="mode-buttons">

                <button id="workBtn">
                    Work
                </button>

                <button id="breakBtn">
                    Break
                </button>

            </div>

            <div id="timer">
                25:00
            </div>

            <div class="buttons">

                <button id="startBtn">
                    Start
                </button>

                <button id="pauseBtn">
                    Pause
                </button>

                <button id="resetBtn">
                    Reset
                </button>

            </div>

            <p id="status">
                Ready to focus?
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>

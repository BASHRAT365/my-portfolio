<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>💰 Expense Tracker</h1>


        <!-- Balance Section -->

        <div class="balance-box">

            <h2>Your Balance</h2>

            <h3 id="balance">$0.00</h3>

        </div>


        <!-- Income and Expense Summary -->

        <div class="summary">

            <div class="income">

                <h3>Income</h3>

                <p id="income">$0.00</p>

            </div>


            <div class="expense">

                <h3>Expense</h3>

                <p id="expense">$0.00</p>

            </div>

        </div>


        <!-- Add Transaction Form -->

        <h2>Add Transaction</h2>

        <form id="transactionForm">

            <input
                type="text"
                id="description"
                placeholder="Enter description"
                required>


            <input
                type="number"
                id="amount"
                placeholder="Enter amount"
                step="0.01"
                required>


            <select id="type">

                <option value="income">
                    Income
                </option>

                <option value="expense">
                    Expense
                </option>

            </select>


            <button type="submit">

                Add Transaction

            </button>

        </form>


        <!-- Transaction List -->

        <h2>Transactions</h2>

        <div id="transactionList">

            <!-- Transactions will appear here -->

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
